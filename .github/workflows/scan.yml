name: scan sevenrooms tables

# Triggered by cron-job.org (POST .../actions/workflows/scan.yml/dispatches with
# inputs.dry_run=false), because GitHub's own cron ran only a few times a day.
# The schedule (in SGT) now lives in cron-job.org, not here.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Scan and print only (no Telegram, no state change)"
        type: boolean
        default: true

permissions:
  contents: write  # to commit state.json (which slots were already alerted)

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Save state
        if: ${{ !inputs.dry_run && !cancelled() }}  # save even if one venue failed
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state: update alerted slots" && git push)
